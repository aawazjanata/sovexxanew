name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json, xml
          coverage: none

      - name: Check PHP version
        run: php -v

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      - name: PHP lint
        timeout-minutes: 5
        shell: bash
        run: |
          set -e

          echo "Checking PHP syntax..."

          find . \
            -type f \
            -name "*.php" \
            -not -path "./vendor/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Linting: $file"
            php -l "$file"
          done

          echo "PHP lint completed successfully."

      - name: Run PHPUnit
        timeout-minutes: 5
        run: |
          vendor/bin/phpunit \
            --configuration tests/phpunit.xml
