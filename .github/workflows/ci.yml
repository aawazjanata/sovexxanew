name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  php:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json, xml
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          echo "Checking PHP syntax..."
          find . -name "*.php" -not -path "./vendor/*" -print0 |
            while IFS= read -r -d '' file; do
              echo "Linting: $file"
              php -l "$file"
            done

      - name: Run PHPUnit
        run: |
          if [ -x "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit --configuration tests/phpunit.xml
          else
            echo "PHPUnit not installed; skipping."
          fi

  build:
    runs-on: ubuntu-latest
    needs: php

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, json, xml
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress

      - name: Build plugin ZIP
        run: |
          php tools/build-zip.php

      - name: Find generated ZIP
        run: |
          find . -maxdepth 3 -type f -name "*.zip" -print

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sovexxa-society-management-plugin
          path: "*.zip"
          if-no-files-found: error
